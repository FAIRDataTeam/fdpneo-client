# nginx server for the built FDP SPA: static assets + history-mode fallback,
# baseline security headers, and a CSP whose connect-src is generated at start
# from the runtime API/IdP origins (see deploy/docker-entrypoint.d/40-fdp-config.sh).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Baseline security headers (audit R-06). The CSP add_header lives in the
    # generated include so it can name the runtime API + IdP origins; nginx
    # applies every add_header in this block, so they compose.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    include /etc/nginx/fdp-headers.conf;

    # The runtime config and the HTML shell must never be cached, so a redeploy
    # (new API origin / new asset hashes) takes effect immediately.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Vite emits content-hashed asset filenames — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history-mode fallback: unknown paths render index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
