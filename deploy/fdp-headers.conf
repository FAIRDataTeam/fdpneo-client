# Default CSP — overwritten at container start by 40-fdp-config.sh, which injects
# the runtime API + IdP origins into connect-src. This baked default is the
# same-origin fallback so `nginx -t` succeeds even before the entrypoint runs.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
