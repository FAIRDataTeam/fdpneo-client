<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FAIR Data Point — a FAIR-aligned metadata repository implementing the FDP specifications."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>FAIR Data Point</title>
    <!--
      Security audit R-06 — Content Security Policy.
      Serve the CSP as an HTTP *response header* from the static host / CDN (NOT a
      <meta> here: a meta tag can't express frame-ancestors/form-action and would
      break the Vite dev server). Recommended production policy (template the API
      and IdP origins for your deployment):

        Content-Security-Policy:
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src  'self' https://fonts.gstatic.com;
          img-src   'self' data:;
          connect-src 'self' https://API.ORIGIN https://IDP.ORIGIN;
          frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'

      Notes: 'unsafe-inline' in style-src is required (Vue/PrimeVue inject inline
      styles); script-src stays 'self' (the production build has no inline JS).
      Also send X-Content-Type-Options, X-Frame-Options, Referrer-Policy, HSTS.

      Deployer white-label logo (branding.logoUrl in /config.js): img-src already
      allows 'self' and data: URIs, which covers a logo dropped into the static
      dir or inlined. A logo on another origin (e.g. a CDN) must be added to
      img-src for that deployment.
    -->
  </head>
  <body>
    <div id="app"></div>
    <!-- Runtime config (window.__FDP_CONFIG__) — the container overwrites this
         from env at start-up. Must load before the app module. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
