# Release pipeline, triggered by a `v*` tag (server ADR-0028):
#   verify          tag == package.json version == release.json, and release.json is valid
#   image           native amd64 and arm64 builds, pushed by digest
#   image-merge     multi-architecture image tagged X.Y.Z, X.Y and latest,
#                   signed with Sigstore keyless signing, provenance attested
#   github-release  GitHub release with the CHANGELOG section as notes and
#                   release.json attached as fdpneo-release.json — the asset the
#                   servers' update check reads.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag, package.json and release.json agree
        run: |
          V=$(node -p 'require("./package.json").version')
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json version $V"; exit 1; }
          python3 scripts/check_release_json.py release.json "$V" client

  # One native build per architecture (GitHub's arm64 runners are free for
  # public repositories), each pushed by digest only. image-merge then
  # assembles the multi-architecture image, tags it, and signs it.
  image:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/fdpneo-client,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.platform }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble X.Y.Z / X.Y / latest from the per-architecture digests, then sign
  # the index with Sigstore keyless signing (server ADR-0028 §1): the
  # certificate binds the signature to this repository, this workflow and this
  # tag. Provenance (how and from which commit it was built) is attested alongside.
  image-merge:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # Sigstore keyless signing and provenance
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fdpneo-client
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Word splitting is intended: one -t per tag, one source per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Resolve the index digest
        id: index
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the image (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.index.outputs.digest }}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Verify the signature as a user would
        run: |
          cosign verify "$IMAGE@${{ steps.index.outputs.digest }}" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verified for $IMAGE@${{ steps.index.outputs.digest }}"

  github-release:
    needs: image-merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG
        run: |
          V="${TAG#v}"
          awk -v v="$V" '/^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG section for $V"; exit 1; }
      - name: Create the release and attach fdpneo-release.json
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest
          cp release.json fdpneo-release.json
          gh release upload "$TAG" fdpneo-release.json --clobber
