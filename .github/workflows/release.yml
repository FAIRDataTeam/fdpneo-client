# Release pipeline, triggered by a `v*` tag (server ADR-0028):
#   verify          tag == package.json version == release.json, and release.json is valid
#   image           version-tagged image: X.Y.Z, X.Y and latest
#   github-release  GitHub release with the CHANGELOG section as notes and
#                   release.json attached as fdpneo-release.json — the asset the
#                   servers' update check reads.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag, package.json and release.json agree
        run: |
          V=$(node -p 'require("./package.json").version')
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json version $V"; exit 1; }
          python3 scripts/check_release_json.py release.json "$V" client

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fdpneo-client
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG
        run: |
          V="${TAG#v}"
          awk -v v="$V" '/^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG section for $V"; exit 1; }
      - name: Create the release and attach fdpneo-release.json
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest
          cp release.json fdpneo-release.json
          gh release upload "$TAG" fdpneo-release.json --clobber
